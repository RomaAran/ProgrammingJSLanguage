<!DOCTYPE html>

<html>

    <head>
        <meta charset="utf-8">
        <title>Регистрация</title>
    </head>

    <body>

        <h2>Регистрация</h2>

        <form method="post" action="/register">

            <p>
                Логин:
                <input type="text" name="login" required>
            </p>

            <p>
                Пароль:
                <input type="password" name="password" required>
            </p>

            <button type="submit">
                Зарегистрироваться
            </button>

        </form>

</body>

</html>
