<!DOCTYPE html>

<html>
    
    <head>
        <meta charset="UTF-8">
        <title>Лабораторная работа 2.2</title>
        <script src="../dom_utils.js"></script>
        <script>
            function clr(){
                var calcPlace = document.getElementById("calculator");
                while (calcPlace.firstChild != null){
                    calcPlace.removeChild(calcPlace.firstChild);
                }
            }

            function add(element){
                document.getElementById('calculator').appendChild(element);
            }

            function createSimple(){
                add(text('id_n1'));
                add(select('id_oper', new Array("+", "-", "*", "/")));
                add(text("id_n2"));
                add(button("=", calculateResult));
                add(text("id_result"));
            }

            function createPercent(){
                add(label('Сумма вклада: '));
                add(text('id_summa')); add(br());
                add(label('Срок вклада (лет): '));
                add(number('id_srok')); add(br());
                add(label('Процентная ставка (годовых): '));
                add(text('id_procent')); add(br());
                add(button("%", calculatePercent)); add(br());
                add(label('Доход: '));
                add(text('id_dohod'));
            }

            function createPower(){
                add(label('Число: '));
                add(text('id_base')); add(br());

                add(label('Степень (для a^b): '));
                add(text('id_exp')); add(br());

                add(select('id_pow_oper', ["^", "√", "∛"])); add(br());

                add(button("=", calculatePower)); add(br());

                add(label('Результат: '));
                add(text('id_pow_result'));
            }

            function calculateResult() {
                var n1 = parseFloat(document.getElementById("id_n1").value);
                var n2 = parseFloat(document.getElementById("id_n2").value);
                var oper = document.getElementById("id_oper").value;

                document.getElementById("id_result").value =
                    oper === "+" ? n1 + n2 :
                    oper === "-" ? n1 - n2 :
                    oper === "*" ? n1 * n2 :
                    oper === "/" ? (n2 === 0 ? "Ошибка" : n1 / n2) :
                    "";
            }
            
            function calculatePercent() {
                var s = document.getElementById("id_summa").value;
                var t = document.getElementById("id_srok").value;
                var p = document.getElementById("id_procent").value;
                document.getElementById('id_dohod').value = 0.01*s*p*t;
            }

            function calculatePower(){
                var base = parseFloat(document.getElementById("id_base").value);
                var exp = parseFloat(document.getElementById("id_exp").value);
                var oper = document.getElementById("id_pow_oper").value;
                var result;

                if (oper === "^"){
                    result = Math.pow(base, exp);
                } 
                else if (oper === "√"){
                    if (base < 0){
                        result = "Ошибка";
                    } else {
                        result = Math.sqrt(base);
                    }
                } 
                else if (oper === "∛"){
                    result = Math.cbrt(base);
                }

                document.getElementById("id_pow_result").value = result;
            }
        </script>
    </head>
    
    <body onload="init()">
        <div id="selector">
        
        <input type="radio" name="calculatorType" onclick="clr(); createSimple()"/>
            Обычный калькулятор

        <br>

        <input type="radio" name="calculatorType" onclick="clr(); createPercent()"/>
        Калькулятор процентов

        <br>

        <input type="radio" name="calculatorType" onclick="clr(); createPower()"/>
        Калькулятор степеней и корней
    
        </div>

        <br>

        <div id="calculator"></div>
    </body>

    </html>
