<!DOCTYPE html>

<html>

    <head>
        <meta charset="UTF-8">
        <title>Лабораторная работа 2.5 - Задания 3</title>
        <script>
            function bindFunction(){
                if (document.getElementById("ordered").checked){
                    document.getElementById("printBtn").onclick = function() {
                        var text = '';
                        for (var i = 1; i < 20; i++){
                            text += (i + " ");
                        }
                        alert(text);
                    };
                } else if (document.getElementById("reverse").checked){
                    document.getElementById("printBtn").onclick = function() {
                        var text = '';
                        for (var i = 20; i >= 1; i--){
                            text += (i + " ");
                        }
                        alert(text);
                    };
                } else if (document.getElementById("random").checked){
                    document.getElementById("printBtn").onclick = function() {
                        var text = '';
                        for (var i = 1; i < 20; i++){
                            text += (Math.floor(100 * Math.random()) + ' ');
                        }
                        alert(text);
                    };
                }
            }
        </script>
    </head>

    <body>
        <input type="radio" name="type" id="ordered" onclick="bindFunction()"/> По возрастанию<br>
        <input type="radio" name="type" id="reverse" onclick="bindFunction()"/> По убыванию<br>
        <input type="radio" name="type" id="random" onclick="bindFunction()"/> Случайно<br>
        <input type="button" id="printBtn" value="Вывести числа"/>
    </body>

</html>
